[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "omnitoken"
version = "0.2.0"
description = "Universal, research-grounded high-performance tokenizer engine for BPE, WordPiece, and Unigram vocabularies."
readme = "README.md"
authors = [
    { name = "Sunay Hegde", email = "sunayhegde2006@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License"
]

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "omnitoken._omnitoken"
