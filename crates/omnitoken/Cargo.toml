[package]
name        = "omnitoken"
description = "OmniToken — universal tokenizer for BPE, WordPiece, and Unigram vocabularies, targeting consumer hardware."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[lib]
name = "omnitoken"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "omnitoken"
path = "src/main.rs"

[dependencies]
omnitoken-core = { path = "../omnitoken-core" }
vocab-ir     = { path = "../vocab-ir" }
trie-builder = { path = "../trie-builder" }
pretokenizer = { path = "../pretokenizer" }
walker       = { path = "../walker" }
hashbrown.workspace = true
clap.workspace    = true
anyhow.workspace  = true
rayon.workspace   = true
# mimalloc: faster small-allocation allocator (Section 4.6)
mimalloc.workspace = true

[features]
default = []
python = ["dep:pyo3"]

[dependencies.pyo3]
workspace = true
optional = true
